<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админка — web-touristKG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main class="login" id="login">
  <form class="login-card" id="loginForm">
    <img src="img/bars-head.png" alt="" width="88" height="88">
    <h1>Админ-панель</h1>
    <p>Войдите, чтобы менять сайт и обрабатывать заявки.</p>
    <label for="pass">Пароль</label>
    <input id="pass" type="password" autocomplete="current-password" autofocus>
    <button class="btn" id="go" type="submit">Войти</button>
    <p class="err" id="err" role="alert"></p>
    <p class="hint" id="demoHint">Демо-режим: пароль <b>admin</b></p>
  </form>
</main>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand"><img src="img/bars-head.png" alt="" width="40" height="40"><b>Админка</b></div>
    <nav id="tabs" aria-label="Разделы"></nav>
    <div class="side-foot"><a class="btn ghost" href="index.html" target="_blank">Открыть сайт ↗</a><button class="btn ghost" id="out" type="button">Выйти</button></div>
  </aside>
  <section class="main">
    <div class="bar" id="bar"><h1 id="title"></h1><span class="mode" id="mode"></span><span class="status" id="status" role="status"></span><span class="trt" id="trTools"><label class="chk"><input type="checkbox" id="autoTr" checked><span>Автоперевод</span></label><button class="btn ghost sm" id="trAll" type="button">Перевести все пустые</button></span><button class="btn" id="save" type="button">Сохранить сайт</button></div>
    <div id="panel"></div>
  </section>
</div>

<script src="js/config.js"></script><script src="js/i18n.js"></script><script src="js/i18n2.js"></script><script src="data/content.js"></script><script src="data/map-data.js"></script><script src="js/store.js"></script><script src="js/admin.js"></script>
</body>
</html>
