openapi: 3.0.3
info:
  title: web-touristKG API (Kyrgyz Trails)
  version: "3.0"
  description: |
    Сервер сайта турфирмы — Cloudflare Worker `worker/worker.js` + хранилище KV.
    Админ-методы требуют заголовок `X-Admin-Password`, методы путешественника — заголовок `X-Token`.
servers:
  - url: https://kyrgyz-trails-api.jijiwq01.workers.dev
    description: Адрес вашего Worker (его же вписывают в js/config.js → API_URL)
tags:
  - name: Leads
    description: Заявки с сайта
  - name: Content
    description: Контент сайта и вход в админку
  - name: Images
    description: Фотографии
  - name: Stories
    description: Впечатления гостей (с модерацией)
  - name: Travellers
    description: Регистрация путешественников и их дневник
  - name: Stats
    description: Статистика
components:
  securitySchemes:
    AdminPassword:
      type: apiKey
      in: header
      name: X-Admin-Password
    TravellerToken:
      type: apiKey
      in: header
      name: X-Token
  schemas:
    Session:
      type: object
      properties:
        token: { type: string }
        user: { type: object, properties: { id: { type: string }, name: { type: string }, email: { type: string } } }
    Lead:
      type: object
      required: [name, country, contact]
      properties:
        name: { type: string, maxLength: 80, example: John }
        country: { type: string, maxLength: 60, example: Spain }
        countryCode: { type: string, maxLength: 3, example: ES }
        app: { type: string, enum: [wa, tg, vb, ph], default: wa, description: "Мессенджер для связи (wa — WhatsApp, tg — Telegram и т.д.)" }
        contact: { type: string, maxLength: 80, example: "+34 600 000 000" }
        speak: { type: string, enum: [ru, en, zh, es], description: Язык общения }
        from: { type: string, example: "2027-07-10" }
        to: { type: string, example: "2027-07-17" }
        people: { type: string, example: "2" }
        tour: { type: string, example: Song-Kol horse trek }
        tourId: { type: string, example: t1 }
        wishes: { type: string, maxLength: 1500 }
        promo: { type: string }
        favs: { type: array, maxItems: 20, items: { type: string } }
        siteLang: { type: string, enum: [ru, en, zh, es] }
    LeadStored:
      allOf:
        - $ref: "#/components/schemas/Lead"
        - type: object
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
            status: { type: string, enum: [new, progress, done] }
            note: { type: string }
    Story:
      type: object
      required: [name, text]
      properties:
        name: { type: string, maxLength: 60 }
        from: { type: string, maxLength: 60, description: Откуда гость }
        text: { type: string, maxLength: 600 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        imgs:
          type: array
          maxItems: 3
          items: { type: string, description: "JPEG data URL (data:image/jpeg;base64,...)" }
    DiaryEntry:
      type: object
      required: [title]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        placeId: { type: string }
        regionId: { type: string }
        title: { type: string, maxLength: 100 }
        lat: { type: number }
        lon: { type: number }
        img: { type: string, description: "JPEG data URL (до ~450 КБ)" }
    Error:
      type: object
      properties:
        error: { type: string, example: auth }
    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }
  responses:
    Unauthorized:
      description: Неверный пароль или токен
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Неверные данные
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooMany:
      description: Слишком много запросов с этого адреса
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /api/lead:
    post:
      tags: [Leads]
      summary: Send a request from the site
      description: Сохраняет заявку и отправляет уведомление в Telegram. Лимит — 5 заявок в час с одного адреса.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Lead" } } }
      responses:
        "200": { description: Заявка принята, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/leads:
    get:
      tags: [Leads]
      summary: List of requests
      security: [{ AdminPassword: [] }]
      responses:
        "200":
          description: Список заявок
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LeadStored" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/leads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Leads]
      summary: Change request status or note
      security: [{ AdminPassword: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [new, progress, done] }
                note: { type: string }
      responses:
        "200": { description: Обновлено }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Leads]
      summary: Delete a request
      security: [{ AdminPassword: [] }]
      responses:
        "200": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/content:
    get:
      tags: [Content]
      summary: Get site content
      description: Туры, регионы, тексты, «О компании», события, цвета.
      responses:
        "200": { description: JSON с контентом сайта, content: { application/json: { schema: { type: object } } } }
    put:
      tags: [Content]
      summary: Save site content
      security: [{ AdminPassword: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Сохранено }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/login:
    post:
      tags: [Content]
      summary: Check the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string } }
      responses:
        "200": { description: Пароль верный, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/translate:
    post:
      tags: [Content]
      summary: Auto-translate a text (ru to en, zh, es)
      description: Работает через Cloudflare Workers AI. Текст до 4000 символов.
      security: [{ AdminPassword: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, from, to]
              properties:
                text: { type: string, maxLength: 4000 }
                from: { type: string, enum: [ru, en, zh, es] }
                to: { type: string, enum: [ru, en, zh, es] }
      responses:
        "200": { description: Переведённый текст }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/upload:
    post:
      tags: [Images]
      summary: Upload a photo
      description: Тело запроса — сам файл (Content-Type image/jpeg, image/png или image/webp). Возвращает адрес фото.
      security: [{ AdminPassword: [] }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Фото сохранено
          content: { application/json: { schema: { type: object, properties: { url: { type: string, example: /api/img/ab12cd34 } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/img/{id}:
    get:
      tags: [Images]
      summary: Get an uploaded photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Файл изображения }
        "404": { description: Не найдено }
  /api/dimg/{uid}/{id}:
    get:
      tags: [Images]
      summary: Get a photo from a traveller diary
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: JPEG-изображение, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { description: Не найдено }
  /api/story:
    post:
      tags: [Stories]
      summary: Leave a guest impression
      description: Уходит на модерацию и не виден на сайте, пока админ не одобрит. Лимит — 3 в час с одного адреса.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Story" } } }
      responses:
        "200": { description: Принято на модерацию, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/stories:
    get:
      tags: [Stories]
      summary: List of approved impressions
      description: С параметром `all=1` и заголовком `X-Admin-Password` возвращает все впечатления, включая неодобренные.
      parameters:
        - { name: all, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Список впечатлений
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Story" } } } }
  /api/stories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Stories]
      summary: Approve a story
      security: [{ AdminPassword: [] }]
      responses:
        "200": { description: Обновлено }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Stories]
      summary: Delete a story
      security: [{ AdminPassword: [] }]
      responses:
        "200": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth:
    post:
      tags: [Travellers]
      summary: Register (with email confirmation) or sign in
      description: |
        **mode=register** — создаёт аккаунт в статусе «не подтверждён» и отправляет письмо со ссылкой (действует 24 часа).
        Токен НЕ выдаётся, пока почта не подтверждена (`POST /api/auth/verify`).
        Адрес проверяется: формат, одноразовые домены, частые опечатки (gmial.com), наличие почтового сервера у домена (DNS MX).
        Пароль: 8–100 символов, буквы и цифры. Повторная регистрация неподтверждённого адреса отправляет письмо заново.

        **mode=login** — вход; для неподтверждённой почты ответ `403 unverified`.

        Коды ошибок в поле `error`: `mail`, `typo` (+`hint`), `disposable`, `nomx`, `pass`, `name`, `used`, `auth`, `unverified`, `mail_off` (503, не настроена отправка писем), `mail_fail` (502), `too many` (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, email, password]
              properties:
                mode: { type: string, enum: [register, login] }
                name: { type: string, maxLength: 60, description: "Обязательно при регистрации" }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 100 }
                lang: { type: string, enum: [ru, en, zh, es], description: "Язык письма" }
      responses:
        "200":
          description: При регистрации `{pending:true,email}`, при входе — токен
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { pending: { type: boolean }, email: { type: string } }
                  - { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Почта не подтверждена (error=unverified)" }
        "409": { description: "Почта уже зарегистрирована (error=used)" }
        "429": { $ref: "#/components/responses/TooMany" }
        "502": { description: "Письмо не отправилось (error=mail_fail)" }
        "503": { description: "Отправка писем не настроена (error=mail_off)" }
  /api/auth/verify:
    post:
      tags: [Travellers]
      summary: Confirm email by the token from the email link
      description: Одноразовый токен из ссылки `?verify=…`. Активирует аккаунт, отправляет письмо «Добро пожаловать» и сразу выдаёт токен входа.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string }, lang: { type: string, enum: [ru, en, zh, es] } } } } }
      responses:
        "200": { description: Вход выполнен, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { description: "Ссылка недействительна или уже использована (error=token)" }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/resend:
    post:
      tags: [Travellers]
      summary: Send the confirmation email again
      description: Всегда отвечает `{ok:true}` (не раскрывает, есть ли адрес). Лимит — 3 письма в час на адрес.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email }, lang: { type: string, enum: [ru, en, zh, es] } } } } }
      responses:
        "200": { description: OK }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/forgot:
    post:
      tags: [Travellers]
      summary: Email a password reset link
      description: Ссылка `?reset=…` действует 1 час. Всегда отвечает `{ok:true}`.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email }, lang: { type: string, enum: [ru, en, zh, es] } } } } }
      responses:
        "200": { description: OK }
        "429": { $ref: "#/components/responses/TooMany" }
  /api/auth/reset:
    post:
      tags: [Travellers]
      summary: Set a new password by the token from the email
      description: После смены приходит письмо-уведомление, выдаётся токен входа.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 8, maxLength: 100 }, lang: { type: string, enum: [ru, en, zh, es] } } } } }
      responses:
        "200": { description: Вход выполнен, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { description: "error=token (ссылка устарела) или error=pass (слабый пароль)" }
  /api/auth/logout:
    post:
      tags: [Travellers]
      summary: Sign out (invalidate the token)
      security: [{ TravellerToken: [] }]
      responses:
        "200": { description: OK }
  /api/diary:
    get:
      tags: [Travellers]
      summary: Traveller diary entries
      security: [{ TravellerToken: [] }]
      responses:
        "200":
          description: Записи дневника
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Travellers]
      summary: Add a diary entry or a passport mark
      security: [{ TravellerToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DiaryEntry" } } }
      responses:
        "200":
          description: Созданная запись
          content: { application/json: { schema: { $ref: "#/components/schemas/DiaryEntry" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Это место уже отмечено сегодня }
  /api/diary/{id}:
    delete:
      tags: [Travellers]
      summary: Delete a diary entry
      security: [{ TravellerToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/users:
    get:
      tags: [Travellers]
      summary: List of travellers
      security: [{ AdminPassword: [] }]
      responses:
        "200": { description: Список путешественников }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/track:
    post:
      tags: [Stats]
      summary: Count an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ev]
              properties:
                ev: { type: string, enum: [view, chat, lead, stamp, checkin] }
      responses:
        "200": { description: Принято, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
  /api/stats:
    get:
      tags: [Stats]
      summary: Site statistics
      security: [{ AdminPassword: [] }]
      responses:
        "200": { description: Счётчики событий }
        "401": { $ref: "#/components/responses/Unauthorized" }
