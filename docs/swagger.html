 "string"}, "favs": {"type": "array", "maxItems": 20, "items": {"type": "string"}}, "siteLang": {"type": "string", "enum": ["ru", "en", "zh", "es"]}}}, "LeadStored": {"allOf": [{"$ref": "#/components/schemas/Lead"}, {"type": "object", "properties": {"id": {"type": "string"}, "at": {"type": "string", "format": "date-time"}, "status": {"type": "string", "enum": ["new", "progress", "done"]}, "note": {"type": "string"}}}]}, "Story": {"type": "object", "required": ["name", "text"], "properties": {"name": {"type": "string", "maxLength": 60}, "from": {"type": "string", "maxLength": 60, "description": "Откуда гость"}, "text": {"type": "string", "maxLength": 600}, "rating": {"type": "integer", "minimum": 1, "maximum": 5}, "imgs": {"type": "array", "maxItems": 3, "items": {"type": "string", "description": "JPEG data URL (data:image/jpeg;base64,...)"}}}}, "DiaryEntry": {"type": "object", "required": ["title"], "properties": {"id": {"type": "string"}, "at": {"type": "string", "format": "date-time"}, "placeId": {"type": "string"}, "regionId": {"type": "string"}, "title": {"type": "string", "maxLength": 100}, "lat": {"type": "number"}, "lon": {"type": "number"}, "img": {"type": "string", "description": "JPEG data URL (до ~450 КБ)"}}}, "Error": {"type": "object", "properties": {"error": {"type": "string", "example": "auth"}}}, "Ok": {"type": "object", "properties": {"ok": {"type": "boolean", "example": true}}}}, "responses": {"Unauthorized": {"description": "Неверный пароль или токен", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "BadRequest": {"description": "Неверные данные", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "TooMany": {"description": "Слишком много запросов с этого адреса", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}, "paths": {"/api/lead": {"post": {"tags": ["Leads"], "summary": "Send a request from the site", "description": "Сохраняет заявку
